<meta charset="utf-8">
<title>Programmation Python ISIMa</title>
<script>try{var _t=localStorage.getItem("apy-theme");if(_t==="dark"||_t==="light")document.documentElement.setAttribute("data-theme",_t)}catch(e){}</script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Mise en page : écran divisé (parcours à gauche, cellules de code au centre) ; tableau de bord enseignant en onglets */
:root{
  --bg:#F4F1FF; --surface:#FFFFFF; --surface2:#ECE7FF; --ink:#17123A; --ink2:#4A4480; --mute:#6F69A3; --line:#D9D1FF;
  --brand:#5B2EFF; --brand-ink:#FFFFFF; --brand-soft:#E6DFFF; --pink:#FF3D9A;
  --ok:#00A870; --ok-bg:#D7FBEC; --bad:#E5173F; --bad-bg:#FFE2E8; --warn:#C77700; --warn-bg:#FFF0C7; --info:#0086E0; --info-bg:#D6EEFF;
  --code-bg:#12102E; --code-ink:#EDEAFF; --code-line:#2B2760; --code-mute:#8A84C2;
  --k:#FF7AC6; --s:#5CF2B0; --n:#FFC53D; --c:#8A84C2; --b:#55C7FF; --d:#B7A2FF;
  --top-bg:linear-gradient(100deg,#4A1FE0 0%,#7A2BFF 55%,#FF3D9A 130%); --top-ink:#fff;
  --shadow:0 1px 0 rgba(23,18,58,.04),0 8px 24px -12px rgba(60,30,160,.28);
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif; --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0A24; --surface:#16133C; --surface2:#1F1B52; --ink:#F1EEFF; --ink2:#C2BCF3; --mute:#9A94D0; --line:#2D2870;
  --brand:#8F6BFF; --brand-ink:#0C0A24; --brand-soft:#2A2370;
  --ok:#22E9A8; --ok-bg:#073A2F; --bad:#FF6C86; --bad-bg:#44121F; --warn:#FFC53D; --warn-bg:#3F2F08; --info:#46B8FF; --info-bg:#0A3250;
  --code-bg:#09071C; --code-line:#241F58; --top-bg:linear-gradient(100deg,#2A1580 0%,#5A21C9 55%,#C42B7C 130%);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0A24; --surface:#16133C; --surface2:#1F1B52; --ink:#F1EEFF; --ink2:#C2BCF3; --mute:#9A94D0; --line:#2D2870;
  --brand:#8F6BFF; --brand-ink:#0C0A24; --brand-soft:#2A2370;
  --ok:#22E9A8; --ok-bg:#073A2F; --bad:#FF6C86; --bad-bg:#44121F; --warn:#FFC53D; --warn-bg:#3F2F08; --info:#46B8FF; --info-bg:#0A3250;
  --code-bg:#09071C; --code-line:#241F58; --top-bg:linear-gradient(100deg,#2A1580 0%,#5A21C9 55%,#C42B7C 130%);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.7); color-scheme:dark}
.themebtn{min-width:40px;padding-inline:.7em}
.themebtn-float{position:fixed;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:60;background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.4);backdrop-filter:blur(6px)}
:root[data-theme="dark"] .themebtn-float{background:rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px;border-radius:6px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono)} .mute{color:var(--mute)} .num{font-variant-numeric:tabular-nums}
svg.i{width:1.1em;height:1.1em;vertical-align:-.17em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;border:2px solid transparent;border-radius:11px;padding:.55em 1em;font-weight:700;cursor:pointer;
  background:var(--surface2);color:var(--ink);transition:transform .08s,filter .15s;min-height:40px;white-space:nowrap}
.btn:hover:not(:disabled){filter:brightness(1.07)} .btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.p{background:var(--brand);color:var(--brand-ink)}
.btn.ok{background:var(--ok);color:#04251B}
.btn.pk{background:var(--pink);color:#fff}
.btn.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.btn.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.sm{min-height:32px;padding:.3em .7em;font-size:13px;border-radius:9px}
.btn.top{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.28)}

/* ---------- champs ---------- */
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-weight:700;font-size:13px;color:var(--ink2)}
.in{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:11px;padding:.6em .8em;min-height:44px}
.in:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 4px var(--brand-soft)}
textarea.in{min-height:90px;resize:vertical;font-family:var(--mono);font-size:13px}
.msg{padding:.6em .85em;border-radius:10px;font-size:14px;font-weight:600}
.msg.bad{background:var(--bad-bg);color:var(--bad)} .msg.ok{background:var(--ok-bg);color:var(--ok)} .msg.warn{background:var(--warn-bg);color:var(--warn)} .msg.info{background:var(--info-bg);color:var(--info)}

/* ---------- chips / led ---------- */
.chip{display:inline-flex;align-items:center;gap:.4em;border-radius:999px;padding:.15em .7em;font-size:12.5px;font-weight:800;background:var(--surface2);color:var(--ink2);white-space:nowrap;letter-spacing:.01em}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.info{background:var(--info-bg);color:var(--info)} .chip.brand{background:var(--brand);color:var(--brand-ink)}
.led{display:inline-block;width:11px;height:11px;border-radius:50%;background:#8b86b8;flex:none}
.led.loading{background:#FFB020;box-shadow:0 0 0 3px rgba(255,176,32,.28);animation:pulse 1s infinite}
.led.ready{background:#19E6A0;box-shadow:0 0 0 3px rgba(25,230,160,.3),0 0 12px #19E6A0}
.led.error{background:#FF3B57;box-shadow:0 0 0 3px rgba(255,59,87,.3),0 0 10px #FF3B57}
.led.on{background:#19E6A0;box-shadow:0 0 8px #19E6A0} .led.off{background:var(--line)}
@keyframes pulse{50%{opacity:.35}}
.pyled{display:inline-flex;align-items:center;gap:.5em;font-weight:700;font-size:13px;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:.35em .85em;cursor:default}
.pyled.light{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.pyled.error{cursor:pointer}

/* ---------- accueil ---------- */
.home{min-height:100vh;display:flex;flex-direction:column}
.hero{background:var(--top-bg);color:#fff;padding-block:clamp(28px,6vw,64px) clamp(70px,9vw,110px);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-90px;top:-90px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),rgba(255,255,255,0) 65%);pointer-events:none}
.hero-in{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.hero .kick{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12.5px;opacity:.92}
.hero h1{font-size:clamp(38px,7vw,72px);font-weight:800;letter-spacing:-.02em}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#FFE066,#5CF2B0);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:56ch;font-size:clamp(16px,2vw,19px);margin:0;opacity:.95}
.hero-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:6px}
.logins{max-width:1080px;margin:-64px auto 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px;position:relative;z-index:2;width:100%}
.lcard{background:var(--surface);border-radius:20px;padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;border-top:6px solid var(--brand)}
.lcard.adm{border-top-color:var(--pink)}
.lcard h2{font-size:24px;display:flex;align-items:center;gap:.5em}
.lcard form{display:flex;flex-direction:column;gap:12px}
.lcard .sub{color:var(--ink2);margin:-6px 0 0;font-size:14px}
.tplist{max-width:1080px;margin:34px auto 40px;width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.tpc{background:var(--surface);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;border:2px solid var(--line)}
.tpc b{font-family:var(--display);font-size:22px;background:var(--brand);color:var(--brand-ink);border-radius:10px;min-width:52px;text-align:center;padding:.15em .3em}
.tpc:nth-child(2) b{background:var(--pink);color:#fff}.tpc:nth-child(3) b{background:var(--ok);color:#04251B}.tpc:nth-child(4) b{background:var(--info);color:#04202F}.tpc:nth-child(5) b{background:#FFB020;color:#2B1B00}.tpc:nth-child(6) b{background:#FF5A36;color:#fff}
.tpc div{min-width:0;display:flex;flex-direction:column}.tpc small{color:var(--mute);font-weight:600}

/* ---------- barre haute ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--top-bg);color:var(--top-ink);display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:9px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:#4A1FE0}
.brand{font-family:var(--display);font-weight:800;font-size:20px;display:flex;align-items:center;gap:.5em;margin-right:auto}
.brand i{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#fff;color:#4A1FE0;font-style:normal;font-size:16px}
.topchip{display:inline-flex;align-items:center;gap:.5em;background:rgba(255,255,255,.16);border-radius:999px;padding:.35em .9em;font-weight:800;font-size:13.5px;white-space:nowrap}
.topchip.warn{background:#FFC53D;color:#2B1B00}.topchip.bad{background:#FF3B57;color:#fff;animation:pulse 1s infinite}
.score{display:flex;flex-direction:column;gap:3px;min-width:150px}
.score .bar{height:7px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden}
.score .bar i{display:block;height:100%;background:linear-gradient(90deg,#FFE066,#5CF2B0);border-radius:9px;transition:width .5s}
.who{font-weight:700;font-size:14px;max-width:18ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop{animation:pop .5s}@keyframes pop{40%{transform:scale(1.12)}}

/* ---------- espace étudiant ---------- */
.shell{display:grid;grid-template-columns:320px minmax(0,1fr);gap:0;align-items:start}
.side{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));max-height:calc(100vh - 56px);overflow:auto;padding:14px 12px 30px max(12px,env(safe-area-inset-left,0px));border-right:2px solid var(--line);background:var(--surface)}
.side h3{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:4px 8px 10px}
.tpg{margin-bottom:8px;border-radius:14px;border:2px solid var(--line);overflow:hidden}
.tpg>button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;background:var(--surface2);font-weight:800}
.tpg>button:focus-visible{outline:3px solid var(--pink);outline-offset:-3px}
.tpg>button b{font-family:var(--display);background:var(--brand);color:var(--brand-ink);border-radius:8px;padding:.05em .45em;font-size:15px}
.tpg>button span{flex:1;min-width:0;font-size:13.5px;line-height:1.25}
.tpg .sc{font-size:12px;color:var(--ink2);font-weight:800}
.exl{list-style:none;margin:0;padding:4px;display:flex;flex-direction:column;gap:2px}
.exl button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;cursor:pointer;font-size:13.5px;line-height:1.25}
.exl button:hover:not([disabled]){background:var(--brand-soft)} .exl button[aria-current="true"]{background:var(--brand);color:var(--brand-ink)}
.exl button[disabled]{opacity:.5;cursor:not-allowed}
.exl button:focus-visible{outline:3px solid var(--pink);outline-offset:-2px}
.exl .st{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:11px;font-weight:800;background:var(--surface2);color:var(--ink2)}
.exl .st.done{background:var(--ok);color:#04251B}.exl .st.cur{background:var(--pink);color:#fff}
.exl button[aria-current="true"] .st{background:#fff;color:var(--brand)}
.exl small{margin-left:auto;font-weight:800;opacity:.8;white-space:nowrap}
.main{padding:22px max(16px,env(safe-area-inset-right,0px)) 80px 24px;min-width:0;max-width:1000px}
.exh{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.exh .kick{font-weight:800;color:var(--brand);letter-spacing:.1em;text-transform:uppercase;font-size:12.5px}
.exh h2{font-size:clamp(26px,4vw,36px)}
.stars{color:#FFB020;letter-spacing:2px}
.intro{background:var(--surface);border:2px dashed var(--line);border-radius:14px;padding:12px 16px;color:var(--ink2)}
.prose p{margin:.45em 0}.prose ul{margin:.4em 0;padding-left:1.3em}.prose li{margin:.15em 0}
.prose code{font-family:var(--mono);font-size:.9em;background:var(--brand-soft);color:var(--ink);padding:.08em .4em;border-radius:6px}
.prose pre{background:var(--code-bg);color:var(--code-ink);padding:10px 12px;border-radius:10px;overflow:auto;font-family:var(--mono);font-size:13px}
.prose pre code{background:none;color:inherit;padding:0}
.cell{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);margin:18px 0;border:2px solid transparent;overflow:hidden}
.cell.done{border-color:var(--ok)} .cell.locked{background:transparent;box-shadow:none;border:2px dashed var(--line)}
.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px;border-bottom:2px solid var(--line)}
.cell.locked .ch{border-bottom:0}
.ch .qn{font-family:var(--display);font-weight:800;font-size:18px;margin-right:auto}
.pts{background:#FFE066;color:#2B1B00;border-radius:999px;padding:.12em .7em;font-weight:800;font-size:13px}
.cb{padding:14px 18px 18px;display:flex;flex-direction:column;gap:12px}
.lockmsg[hidden]{display:none}
.lockmsg{padding:6px 18px 16px;color:var(--mute);font-weight:600;display:flex;gap:8px;align-items:center}
.qtxt{font-size:15.5px}
.ed{display:grid;grid-template-columns:auto minmax(0,1fr);background:var(--code-bg);border-radius:12px;overflow:hidden;border:2px solid var(--code-line);--lh:22px}
.ed:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.ed-g{overflow:hidden;padding:12px 10px 12px 12px;text-align:right;color:var(--code-mute);font:13.5px/var(--lh) var(--mono);user-select:none;white-space:pre;border-right:1px solid var(--code-line);min-width:38px}
.ed-c{position:relative;min-width:0}
.ed-h,.ed-t{margin:0;padding:12px 14px;font:13.5px/var(--lh) var(--mono);tab-size:4;white-space:pre;letter-spacing:0;border:0;word-spacing:0}
.ed-h{position:absolute;inset:0;overflow:hidden;color:var(--code-ink);pointer-events:none}
.ed-h code{font:inherit}
.ed-t{position:relative;display:block;width:100%;resize:none;overflow:auto;background:transparent;color:transparent;caret-color:#fff;outline:none;-webkit-text-fill-color:transparent}
.ed-t::selection{background:rgba(143,107,255,.55);-webkit-text-fill-color:transparent}
.ed-t[readonly]{opacity:.9}
.ed .k{color:var(--k);font-weight:700}.ed .s{color:var(--s)}.ed .n{color:var(--n)}.ed .c{color:var(--c);font-style:italic}.ed .b{color:var(--b)}.ed .d{color:var(--d);font-weight:700}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.acts .grow{margin-left:auto;color:var(--mute);font-size:13px;font-weight:700}
.stdinbox{display:flex;flex-direction:column;gap:5px}
.stdinbox textarea{min-height:56px}
.out{background:var(--code-bg);color:var(--code-ink);border-radius:12px;padding:10px 14px;font:13px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto;margin:0}
.out .e{color:#FF8CA0;font-weight:700}.out .inp{color:#5CF2B0}
.outl{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:5px}
.res{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-left:6px solid var(--line);background:var(--surface2)}
.res.ok{background:var(--ok-bg);border-color:var(--ok)}.res.ko{background:var(--bad-bg);border-color:var(--bad)}
.res h4{font-size:17px}.res.ok h4{color:var(--ok)}.res.ko h4{color:var(--bad)}
.res ul{margin:0;padding-left:1.1em}
.sol{border:2px dashed var(--warn);border-radius:12px;padding:10px;background:var(--warn-bg);display:flex;flex-direction:column;gap:8px}
.sol h4{color:var(--warn);font-size:15px}
.sol pre{margin:0;background:var(--code-bg);color:var(--code-ink);padding:10px 14px;border-radius:10px;overflow:auto;font:13px/1.55 var(--mono)}
.nextbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--ok-bg);color:var(--ok);padding:14px 18px;border-radius:14px;font-weight:800;margin-top:20px}
.banner{padding:9px max(16px,env(safe-area-inset-left,0px));font-weight:700;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warn-bg);color:var(--warn)}.banner.bad{background:var(--bad-bg);color:var(--bad)}
.burger{display:none}

/* ---------- espace enseignant ---------- */
.adm-wrap{max-width:1280px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left,0px)) 80px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;border-bottom:3px solid var(--line)}
.tabs button{all:unset;cursor:pointer;padding:10px 16px;font-weight:800;border-radius:12px 12px 0 0;color:var(--ink2);box-sizing:border-box}
.tabs button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
.tabs button:focus-visible{outline:3px solid var(--pink);outline-offset:-3px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);border-left:6px solid var(--brand)}
.kpi:nth-child(2){border-color:var(--ok)}.kpi:nth-child(3){border-color:var(--pink)}.kpi:nth-child(4){border-color:#FFB020}
.kpi small{font-weight:800;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;font-size:11.5px}
.kpi b{display:block;font-family:var(--display);font-size:32px;line-height:1.1}
.panel{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:18px;margin-bottom:18px}
.panel h3{font-size:20px;margin-bottom:12px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.tw{overflow-x:auto;border-radius:12px;border:2px solid var(--line)}
table.t{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
table.t th{background:var(--surface2);text-align:left;padding:9px 11px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}
table.t td{padding:9px 11px;border-top:1px solid var(--line);vertical-align:middle}
table.t tr.off td{opacity:.55}
table.t td.nm{min-width:170px}table.t td.nm small{display:block;color:var(--mute)}
.cellsc{display:flex;flex-direction:column;gap:3px;min-width:92px}

<script type="text/plain" id="pyworker">/* Worker Python : Pyodide dans un fil séparé (interruptible en cas de boucle infinie) */
const RUNNER = "import sys, io, os, tempfile, traceback, json, shutil\nos.environ['MPLBACKEND'] = 'Agg'\nimport warnings\nwarnings.filterwarnings('ignore', message='.*non-interactive.*')\n\n_LIMIT = 200000\n\nclass _Tee:\n    def __init__(self, show, cmp):\n        self.show = show\n        self.cmp = cmp\n        self.n = 0\n    def write(self, s):\n        s = str(s)\n        self.n += len(s)\n        if self.n > _LIMIT:\n            raise RuntimeError(\"Trop de sortie : programme interrompu\")\n        self.show.write(s)\n        self.cmp.write(s)\n        return len(s)\n    def flush(self):\n        pass\n    def isatty(self):\n        return False\n\ndef _fmt_err(e, stage):\n    if isinstance(e, SyntaxError):\n        return \"SyntaxError (ligne %s) : %s\" % (e.lineno, e.msg)\n    frames = [f for f in traceback.extract_tb(e.__traceback__) if f.filename in (\"<code>\", \"<post>\")]\n    where = \"\"\n    if frames:\n        f = frames[-1]\n        where = \" (ligne %d)\" % f.lineno if f.filename == \"<code>\" else \" (dans le test)\"\n    return \"%s : %s%s\" % (type(e).__name__, e, where)\n\ndef _grab_figs():\n    out = []\n    plt = sys.modules.get('matplotlib.pyplot')\n    if plt is None:\n        return out\n    try:\n        import base64\n        for num in list(plt.get_fignums())[:8]:\n            fig = plt.figure(num)\n            b = io.BytesIO()\n            fig.savefig(b, format='png', dpi=80, bbox_inches='tight')\n            out.append(base64.b64encode(b.getvalue()).decode())\n        plt.close('all')\n    except BaseException:\n        pass\n    return out\n\ndef run_case(code, stdin_lines=None, post=\"\", setup=\"\"):\n    show = io.StringIO()\n    cmp = io.StringIO()\n    tee = _Tee(show, cmp)\n    lines = list(stdin_lines or [])\n    pos = [0]\n\n    def fake_input(prompt=\"\"):\n        show.write(str(prompt))\n        if pos[0] >= len(lines):\n            show.write(\"\\n\")\n            raise EOFError(\"input() attend une valeur : compl\u00e9tez la zone \u00ab Entr\u00e9es \u00bb (une ligne par input)\")\n        v = lines[pos[0]]\n        pos[0] += 1\n        show.write(v + \"\\n\")\n        return v\n\n    old = (sys.stdout, sys.stderr, os.getcwd())\n    tmp = tempfile.mkdtemp()\n    os.chdir(tmp)\n    try:\n        if os.path.isdir('/dbfiles'):\n            for _n in os.listdir('/dbfiles'):\n                shutil.copy('/dbfiles/' + _n, os.path.join(tmp, _n))\n    except Exception:\n        pass\n    figs = []\n    g = {\"__name__\": \"__main__\", \"input\": fake_input}\n    err = None\n    err_stage = None\n    post_at = None\n    try:\n        sys.stdout = io.StringIO()\n        sys.stderr = tee\n        if setup:\n            try:\n                exec(compile(setup, \"<setup>\", \"exec\"), g)\n            except BaseException as e:\n                err, err_stage = \"Erreur interne (setup) : %s\" % e, \"setup\"\n        if err is None:\n            sys.stdout = tee\n            try:\n                exec(compile(code, \"<code>\", \"exec\"), g)\n            except SystemExit:\n                pass\n            except BaseException as e:\n                err, err_stage = _fmt_err(e, \"code\"), \"code\"\n            figs = _grab_figs()\n            post_at = len(cmp.getvalue())\n            if post and err is None:\n                try:\n                    exec(compile(post, \"<post>\", \"exec\"), g)\n                except SystemExit:\n                    pass\n                except BaseException as e:\n                    err, err_stage = _fmt_err(e, \"post\"), \"post\"\n    finally:\n        sys.stdout, sys.stderr = old[0], old[1]\n        try:\n            os.chdir(old[2])\n        except Exception:\n            pass\n        shutil.rmtree(tmp, ignore_errors=True)\n    return {\"show\": show.getvalue(), \"out\": cmp.getvalue(), \"post_at\": post_at if post_at is not None else 0,\n            \"err\": err, \"err_stage\": err_stage, \"figs\": figs}\n\ndef run_case_json(code, stdin_json, post, setup):\n    return json.dumps(run_case(code, json.loads(stdin_json), post, setup))\n";
let py = null, runFn = null, numpyLoaded = false;
self.onmessage = async (e) => {
  const m = e.data;
  if (m.type === 'init') {
    const errs = [], srcs = [];
    if (m.local !== false) srcs.push({ base: m.base, std: m.base + 'stdlib.wasm', n: 'serveur local' });
    ['https://cdn.jsdelivr.net/pyodide/v0.26.4/full/', 'https://pyodide-cdn2.iodide.io/v0.26.4/full/'].forEach((u, i) => srcs.push({ base: u, std: null, n: 'CDN ' + (i + 1) }));
    for (const src of srcs) {
      try {
        importScripts(src.base + 'pyodide.js');
        py = await loadPyodide(src.std ? { indexURL: src.base, stdLibURL: src.std } : { indexURL: src.base });
        py.runPython(RUNNER);
        runFn = py.globals.get('run_case_json');
        const v = py.runPython('import sys\nsys.version.split()[0]');
        postMessage({ type: 'ready', python: String(v) });
        return;
      } catch (err) { errs.push(src.n + ' : ' + String((err && err.message) || err).slice(0, 160)); py = null; }
    }
    postMessage({ type: 'fatal', message: errs.join(' | ') });
    return;
  }
  if (m.type === 'load') {
    const ok = [];
    for (const n of m.pk) {
      try {
        if (n === 'odfpy') { await py.loadPackage('micropip'); await py.runPythonAsync("import micropip\nawait micropip.install('odfpy')"); }
        else await py.loadPackage(n);
        ok.push(n);
      } catch (err) {}
    }
    postMessage({ type: 'loaded', id: m.id, ok });
    return;
  }
  if (m.type === 'run') {
    try {
      if (m.files || m.keep) {
        try {
          if (!py.FS.analyzePath('/dbfiles').exists) py.FS.mkdir('/dbfiles');
          (m.files || []).forEach(f => py.FS.writeFile('/dbfiles/' + f.name, new Uint8Array(f.buf)));
          if (m.keep) py.FS.readdir('/dbfiles').forEach(n => { if (n !== '.' && n !== '..' && m.keep.indexOf(n) < 0) { try { py.FS.unlink('/dbfiles/' + n); } catch (e) {} } });
        } catch (e) {}
      }
      if (!numpyLoaded && /numpy/.test(m.code + '\n' + m.post + '\n' + m.setup)) {
        await py.loadPackage('numpy');
        numpyLoaded = true;
      }
      const r = runFn(m.code, JSON.stringify(m.stdin || []), m.post || '', m.setup || '');
      postMessage({ type: 'result', id: m.id, r: JSON.parse(r) });
    } catch (err) {
      postMessage({ type: 'result', id: m.id, r: { show: '', out: '', post_at: 0, err: 'Erreur interne : ' + ((err && err.message) || err), err_stage: 'internal' } });
    }
  }
};
</script>

ore = sum(criteres.values())\n    manquants = [nom for nom, ok in criteres.items() if not ok]\n    return score, manquants\n\ndef generer_mot_de_passe(longueur=12):\n    lettres_maj = string.ascii_uppercase\n    lettres_min = string.ascii_lowercase\n    chiffres = string.digits\n    speciaux = \"!@#$%^&*\"\n    tous = lettres_maj + lettres_min + chiffres + speciaux\n    while True:\n        mdp = \"\".join(secrets.choice(tous) for _ in range(longueur))\n        if (any(c in lettres_maj for c in mdp) and any(c in lettres_min for c in mdp)\n                and any(c in chiffres for c in mdp) and any(c in speciaux for c in mdp)):\n            return mdp\n\n# Écrivez votre code ici\n","pts":10,"hint":"score, manquants = evaluer_mot_de_passe(mdp_genere) puis assert score == 5.","x":"eyJzb2x1dGlvbiI6ICJpbXBvcnQgc2VjcmV0c1xuaW1wb3J0IHN0cmluZ1xuXG5kZWYgZXZhbHVlcl9tb3RfZGVfcGFzc2UobWRwKTpcbiAgICBjYXJhY3RlcmVzX3NwZWNpYXV4ID0gXCIhQCMkJV4mKlwiXG4gICAgY3JpdGVyZXMgPSB7XG4gICAgICAgIFwiYXUgbW9pbnMgMSBtYWp1c2N1bGVcIjogYW55KGMuaXN1cHBlcigpIGZvciBjIGluIG1kcCksXG4gICAgICAgIFwiYXUgbW9pbnMgMSBtaW51c2N1bGVcIjogYW55KGMuaXNsb3dlcigpIGZvciBjIGluIG1kcCksXG4gICAgICAgIFwiYXUgbW9pbnMgMSBjaGlmZnJlXCI6IGFueShjLmlzZGlnaXQoKSBmb3IgYyBpbiBtZHApLFxuICAgICAgICBcImF1IG1vaW5zIDEgY2FyYWN0w6hyZSBzcMOpY2lhbCAoIUAjJCVeJiopXCI6IGFueShjIGluIGNhcmFjdGVyZXNfc3BlY2lhdXggZm9yIGMgaW4gbWRwKSxcbiAgICAgICAgXCJsb25ndWV1ciBtaW5pbWFsZSBkZSA4IGNhcmFjdMOocmVzXCI6IGxlbihtZHApID49IDgsXG4gICAgfVxuICAgIHNjb3JlID0gc3VtKGNyaXRlcmVzLnZhbHVlcygpKVxuICAgIG1hbnF1YW50cyA9IFtub20gZm9yIG5vbSwgb2sgaW4gY3JpdGVyZXMuaXRlbXMoKSBpZiBub3Qgb2tdXG4gICAgcmV0dXJuIHNjb3JlLCBtYW5xdWFudHNcblxuZGVmIGdlbmVyZXJfbW90X2RlX3Bhc3NlKGxvbmd1ZXVyPTEyKTpcbiAgICBsZXR0cmVzX21haiA9IHN0cmluZy5hc2NpaV91cHBlcmNhc2VcbiAgICBsZXR0cmVzX21pbiA9IHN0cmluZy5hc2NpaV9sb3dlcmNhc2VcbiAgICBjaGlmZnJlcyA9IHN0cmluZy5kaWdpdHNcbiAgICBzcGVjaWF1eCA9IFwiIUAjJCVeJipcIlxuICAgIHRvdXMgPSBsZXR0cmVzX21haiArIGxldHRyZXNfbWluICsgY2hpZmZyZXMgKyBzcGVjaWF1eFxuICAgIHdoaWxlIFRydWU6XG4gICAgICAgIG1kcCA /* correction d'une question : retourne {ok, notes[], tests[]} */
async function gradeQuestion(q, code) {
  const x = getX(q), notes = [];
  for (const r of x.req || []) { let re; try { re = new RegExp(r[0], 's'); } catch (e) { continue; } if (!re.test(code)) notes.push(r[1]); }

  const tests = [];
  for (let i = 0; i < x.tests.length; i++) {
    const t = x.tests[i];
    const r = await Py.run({ code, stdin: t.stdin, post: t.post, setup: x.setup }, 7000);
    let ok;
    if (r.err) ok = false;
    else if (t.cmp === 'none') ok = true;
    else ok = normOut(t.cmp === 'post' ? r.out.slice(r.post_at) : r.out) === t.exp;
    tests.push({ ok, r, t, i, got: t.cmp === 'post' ? r.out.slice(r.post_at) : r.out });
    if (r.err_stage === 'engine' || r.err_stage === 'timeout') break;
  }
  const ok = notes.length === 0 && tests.length === x.tests.length && tests.every(t => t.ok);
  return { ok, notes, tests };
}

/* vérification « je ne suis pas un robot » : clic humain requis avant la connexion étudiante */
function buildRobotCheck() {
  let state = 'idle', t0 = Date.now();

  const node = el('div', { class: 'robotwrap' }, btn);
  const set = st => { state = st; btn.dataset.state = st; btn.setAttribute('aria-checked', String(st === 'ok'));
    label.textContent = st === 'ok' ? 'Vérification réussie' : st === 'busy' ? 'Vérification en cours…' : 'Vérifier que vous n’êtes pas un robot'; };
  btn.addEventListener('click', e => {
    if (state === 'busy') return; if (state === 'ok') { set('idle'); return; }
