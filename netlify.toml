   [build]
     publish = "public"
     functions = "netlify/functions"

   [functions]
     node_bundler = "esbuild"

   [[headers]]
     for = "/*.html"
     [headers.values]
       Cache-Control = "no-cache, must-revalidate"
       Content-Type = "text/html; charset=UTF-8"

   [[headers]]
     for = "/"
     [headers.values]
       Cache-Control = "no-cache, must-revalidate"
       Content-Type = "text/html; charset=UTF-8"
